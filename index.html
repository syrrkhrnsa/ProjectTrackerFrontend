<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Project Tracker</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="container-fluid app-container">
      <div class="row min-vh-100">
        <div class="col-md-5 p-4 project-list-panel">
          <h2 class="mb-4 text-center header-main">Your Projects</h2>
          <div class="d-flex mb-3 justify-content-center">
            <button class="btn btn-primary add-project-btn" id="addProjectBtn">
              <i class="fas fa-plus me-2"></i>Add New Project
            </button>
          </div>
          <ul class="list-group project-items-list" id="projectList"></ul>
        </div>

        <div class="col-md-7 p-4 right-panel" id="rightPanel">
          <div id="formContainer" class="form-container">
            <h2 id="formTitle" class="mb-4 text-center">
              Add/Edit Project/Task
            </h2>
            <form id="projectTaskForm">
              <input type="hidden" id="entityType" />
              <input type="hidden" id="entityId" />
              <input type="hidden" id="currentProjectId" />

              <div class="mb-3" id="projectFieldGroup">
                <label for="projectName" class="form-label">Project Name</label>
                <input
                  type="text"
                  class="form-control form-control-lg"
                  id="projectName"
                  name="name"
                  placeholder="Enter project name"
                />
              </div>

              <div class="mb-3" id="taskFieldGroup" style="display: none">
                <label for="taskName" class="form-label">Task Name</label>
                <input
                  type="text"
                  class="form-control"
                  id="taskName"
                  name="name"
                  placeholder="Enter task name"
                />

                <label for="taskStatus" class="form-label mt-3">Status</label>
                <select class="form-select" id="taskStatus" name="status">
                  <option value="Draft">Draft</option>
                  <option value="In Progress">In Progress</option>
                  <option value="Done">Done</option>
                </select>

                <label for="taskWeight" class="form-label mt-3">Bobot</label>
                <input
                  type="number"
                  class="form-control"
                  id="taskWeight"
                  name="weight"
                  min="1"
                  value="1"
                  placeholder="Task weight (e.g., 1-10)"
                />
              </div>

              <div class="d-flex justify-content-end mt-4 form-actions">
                <button
                  type="button"
                  class="btn btn-outline-danger me-2"
                  id="deleteBtn"
                >
                  <i class="fas fa-trash-alt me-2"></i>Delete
                </button>
                <button type="submit" class="btn btn-success" id="saveBtn">
                  <i class="fas fa-save me-2"></i>Save
                </button>
              </div>
            </form>
            <button
              type="button"
              class="btn btn-link hide-form-btn"
              id="hideFormBtn"
            >
              <i class="fas fa-arrow-left me-2"></i>Hide
            </button>
          </div>

          <div id="initialView" class="initial-view">
            <i class="fas fa-hand-pointer fa-3x mb-3 text-muted"></i>
            <p class="text-muted fs-5">
              Select a project or task, or add a new one.
            </p>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
